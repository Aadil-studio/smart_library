<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smart Library · Catalog</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f7fb; --surface:#ffffff; --text:#0f172a; --muted:#64748b;
    --border:#e5e7eb; --primary:#4f46e5; --primary-soft:#eef2ff;
    --success:#16a34a; --warn:#d97706; --danger:#dc2626;
    --radius:14px; --shadow:0 1px 2px rgba(0,0,0,.04), 0 8px 24px rgba(15,23,42,.06);
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#0b1220; --surface:#111a2e; --text:#e2e8f0; --muted:#94a3b8;
           --border:#1e293b; --primary:#818cf8; --primary-soft:#1e1b4b; }
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text)}
  .layout{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
  @media (max-width:800px){ .layout{grid-template-columns:1fr} .sidebar{display:none} }

  /* sidebar */
  .sidebar{background:var(--surface);border-right:1px solid var(--border);padding:24px 16px}
  .brand{font-weight:700;font-size:18px;margin-bottom:24px;display:flex;align-items:center;gap:10px}
  .brand span{width:28px;height:28px;border-radius:8px;background:var(--primary);display:inline-block}
  .nav a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;
         color:var(--muted);text-decoration:none;font-size:14px;font-weight:500}
  .nav a:hover{background:var(--primary-soft);color:var(--primary)}
  .nav a.active{background:var(--primary-soft);color:var(--primary);font-weight:600}

  /* main */
  main{padding:28px 32px;max-width:1300px;width:100%}
  .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}
  h1{margin:0;font-size:24px}
  .muted{color:var(--muted);font-size:14px}

  /* stat cards */
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}
  @media (max-width:900px){ .stats{grid-template-columns:repeat(2,1fr)} }
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
        padding:18px;box-shadow:var(--shadow)}
  .card .label{color:var(--muted);font-size:13px;font-weight:500}
  .card .value{font-size:28px;font-weight:700;margin-top:6px}

  /* toolbar */
  .toolbar{display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap}
  .search{flex:1;min-width:220px;position:relative}
  .search input{width:100%;padding:11px 14px 11px 40px;border-radius:10px;border:1px solid var(--border);
                background:var(--surface);color:var(--text);font:inherit}
  .search::before{content:"🔍";position:absolute;left:14px;top:50%;transform:translateY(-50%);opacity:.6}
  .toolbar select,.toolbar button{padding:11px 14px;border-radius:10px;border:1px solid var(--border);
                                   background:var(--surface);color:var(--text);font:inherit;cursor:pointer}

  /* table */
  .table-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
              box-shadow:var(--shadow);overflow:hidden}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{padding:14px 16px;text-align:left;border-bottom:1px solid var(--border)}
  th{font-weight:600;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.04em}
  tbody tr{cursor:pointer;transition:background .12s}
  tbody tr:hover{background:var(--primary-soft)}
  tbody tr:last-child td{border-bottom:none}
  .badge{display:inline-block;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:600}
  .badge.avail{background:#dcfce7;color:#166534}
  .badge.out{background:#fee2e2;color:#991b1b}

  .actions{display:flex;gap:8px;justify-content:flex-end}
  .btn-icon{border:1px solid var(--border);background:transparent;border-radius:8px;
            padding:6px 10px;cursor:pointer;color:var(--text);font-size:13px}
  .btn-icon:hover{border-color:var(--primary);color:var(--primary)}
  .btn-icon:disabled{opacity:.35;cursor:not-allowed}

  .empty{padding:48px;text-align:center;color:var(--muted)}
  .toast{position:fixed;right:20px;bottom:20px;background:var(--surface);border:1px solid var(--border);
         border-left:4px solid var(--primary);padding:14px 18px;border-radius:10px;box-shadow:var(--shadow);
         font-size:14px;opacity:0;transform:translateY(8px);transition:.25s;pointer-events:none}
  .toast.show{opacity:1;transform:translateY(0)}
</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="brand"><span></span> Smart Library</div>
    <nav class="nav">
      <a href="#" class="active">📚 Catalog</a>
      <a href="#">📖 My Books</a>
      <a href="#">⏳ Reservations</a>
      <a href="#">👤 Profile</a>
      <a href="#" id="logout">↩︎ Sign out</a>
    </nav>
  </aside>

  <main>
    <div class="topbar">
      <div>
        <h1>Catalog</h1>
        <div class="muted" id="subtitle">Loading…</div>
      </div>
    </div>

    <section class="stats">
      <div class="card"><div class="label">Total titles</div><div class="value" id="stat-total">—</div></div>
      <div class="card"><div class="label">Available now</div><div class="value" id="stat-avail">—</div></div>
      <div class="card"><div class="label">Categories</div><div class="value" id="stat-cats">—</div></div>
      <div class="card"><div class="label">Digital copies</div><div class="value" id="stat-pdf">—</div></div>
    </section>

    <div class="toolbar">
      <div class="search"><input id="q" placeholder="Search title, author, ISBN…" autocomplete="off"></div>
      <select id="filter-category"><option value="">All categories</option></select>
      <select id="filter-availability">
        <option value="">Any availability</option>
        <option value="available">Available</option>
        <option value="out">Checked out</option>
      </select>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Title</th><th>Author</th><th>ISBN</th>
            <th>Category</th><th>Status</th><th style="text-align:right">Actions</th>
          </tr>
        </thead>
        <tbody id="rows"><tr><td colspan="6" class="empty">Loading…</td></tr></tbody>
      </table>
    </div>
  </main>
</div>

<div class="toast" id="toast"></div>

<script src="/static/js/student.js"></script>
</body>
</html>
