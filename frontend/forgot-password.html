<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#0a0d2b">
  <title>Recover account | Northstar Library</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link rel="stylesheet" href="css/style.css">
  <script defer src="js/common.js"></script><script defer src="js/auth.js"></script>
</head>
<body>
  <div class="app-background" aria-hidden="true"></div><div class="ambient-orb" aria-hidden="true"></div><div class="alert-region" aria-live="polite"></div>
  <main class="auth-page"><div class="auth-wrap">
    <div class="auth-brand"><a class="brand" href="index.html"><span class="brand-mark"><i class="fa-solid fa-book-open-reader"></i></span> Northstar Library</a></div>
    <section class="auth-card glass-panel" aria-labelledby="form-title">
      <span class="eyebrow"><i class="fa-solid fa-key"></i> Account recovery</span><h1 class="auth-heading" id="form-title">Forgot your password?</h1>
      <p class="auth-subtitle">Enter the email linked to your library account. We’ll guide you through a quick verification step.</p>
      <form class="form-stack" id="forgotForm" novalidate>
        <div class="field"><label for="recovery-email">Email address</label><div class="input-wrap"><i class="field-icon fa-regular fa-envelope"></i><input id="recovery-email" name="email" type="email" autocomplete="email" placeholder="you@university.edu" required></div></div>
        <button class="primary-btn full" type="submit"><span>Continue</span><i class="fa-solid fa-arrow-right"></i></button>
      </form>
      <p class="auth-footer"><a class="text-link" href="login.html"><i class="fa-solid fa-arrow-left"></i> Back to sign in</a></p>
      <p class="auth-note">Recovery is simulated for this frontend demo. No email is sent.</p>
    </section>
  </div></main>
</body>
</html>
