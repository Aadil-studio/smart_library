<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#0a0d2b">
  <title>Verify email | Northstar Library</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link rel="stylesheet" href="css/style.css">
  <script defer src="js/common.js"></script><script defer src="js/auth.js"></script>
</head>
<body>
  <div class="app-background" aria-hidden="true"></div><div class="ambient-orb" aria-hidden="true"></div><div class="alert-region" aria-live="polite"></div>
  <main class="auth-page"><div class="auth-wrap">
    <div class="auth-brand"><a class="brand" href="index.html"><span class="brand-mark"><i class="fa-solid fa-book-open-reader"></i></span> Northstar Library</a></div>
    <section class="auth-card glass-panel" aria-labelledby="form-title">
      <span class="eyebrow"><i class="fa-solid fa-shield-halved"></i> Step 2 of 3</span><h1 class="auth-heading" id="form-title">Verify your email</h1>
      <p class="auth-subtitle">Enter the six-digit verification code to continue. The demo accepts any six digits.</p>
      <form class="form-stack" id="otpForm" novalidate>
        <div class="otp-inputs" role="group" aria-label="Six digit verification code">
          <input name="otp" inputmode="numeric" autocomplete="one-time-code" aria-label="Digit 1" maxlength="1" required><input name="otp" inputmode="numeric" aria-label="Digit 2" maxlength="1" required><input name="otp" inputmode="numeric" aria-label="Digit 3" maxlength="1" required><input name="otp" inputmode="numeric" aria-label="Digit 4" maxlength="1" required><input name="otp" inputmode="numeric" aria-label="Digit 5" maxlength="1" required><input name="otp" inputmode="numeric" aria-label="Digit 6" maxlength="1" required>
        </div>
        <button class="primary-btn full" type="submit"><span>Verify code</span><i class="fa-solid fa-arrow-right"></i></button>
      </form>
      <p class="auth-footer">Wrong email? <a class="text-link" href="forgot-password.html">Start again</a></p>
      <p class="auth-note">A real deployment should verify a time-limited code on the server.</p>
    </section>
  </div></main>
</body>
</html>
