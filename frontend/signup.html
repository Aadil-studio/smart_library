<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1020"><title>Create account | Northstar Library</title><link rel="stylesheet" href="css/northstar.css"></head>
<body data-page="signup" data-base="">
<div id="toast"></div>
<div id="auth" class="auth">
<section class="hero"><div class="logo">Northstar <b>Library</b></div>
  <div><h1>Every book your campus needs, in one place.</h1><p>Search 60 titles, borrow in one tap, and keep track of due dates. Librarians and admins manage the whole shelf from the same app.</p></div>
  <div class="shelf" id="shelf"></div><div class="float" id="float"></div></section>
<section class="formside"><div class="card">
<h2>Join the library</h2><p class="sub">Create your student account, then sign in to get started.</p><form id="fup"><label>Full name</label><input id="sn" required><div class="row2"><div><label>Student ID</label><input id="si" placeholder="STU-3001" required></div><div><label>Semester</label><select id="ss"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option></select></div></div>
   <label>University email</label><input id="se" type="email" required><label>Department</label><select id="sd"><option>Computer Science</option><option>Engineering</option><option>Business</option><option>Health Sciences</option><option>Natural Sciences</option><option>Arts &amp; Humanities</option></select>
   <div class="row2"><div><label>Password</label><input id="sp" type="password" minlength="8" required></div><div><label>Confirm</label><input id="sc" type="password" required></div></div>
   <button class="btn" style="width:100%;margin-top:18px">Create account</button></form><p class="alt">Already registered? <a class="lnk" href="login.html">Sign in</a></p>
</div></section></div>
<script src="js/northstar.js"></script></body></html>
