<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="theme-color" content="#0b1020">
    <title>My fines | Northstar Library</title>
    <link rel="stylesheet" href="../css/northstar.css">
  </head>
  <body class="student-dashboard" data-page="dash" data-need="student" data-base="../" data-initial-view="fines">
    <div id="toast"></div>
    <div id="app" class="app student-app">
      <aside class="student-sidebar" id="student-sidebar">
        <a class="logo student-brand" href="dashboard.html" aria-label="Northstar Library dashboard"><span class="brand-mark">N</span><span>Northstar <b>Library</b><small>STUDENT PORTAL</small></span></a>
        <div class="student-nav-label">YOUR LIBRARY</div>
        <div id="nav" class="student-nav"></div>
        <div class="student-sidebar-bottom">
          <a class="student-profile" href="profile.html">
            <div class="av" id="sidebar-avatar"></div>
            <span><strong id="sidebar-name"></strong><small>Student account</small></span>
          </a>
          <button class="nav student-signout" onclick="logout()"><span aria-hidden="true">↗</span>Sign out</button>
        </div>
      </aside>
      <button id="nav-backdrop" class="student-nav-backdrop" aria-label="Close navigation" hidden onclick="toggleStudentNav(false)"></button>
      <main class="student-main">
        <header class="top student-header">
          <button class="student-menu-toggle" aria-label="Open navigation" aria-expanded="false" onclick="toggleStudentNav()">☰</button>
          <div class="student-heading">
            <div class="student-breadcrumb">Northstar Library <span>/</span> Student</div>
            <h2 id="ptitle">My fines</h2>
          </div>
          <div class="top-meta student-header-tools">
            <div class="student-search-wrap">
              <label class="student-search" aria-label="Search books">
                <span aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 4.5 4.5"/></svg></span>
                <input id="student-global-search" type="search" placeholder="Search books..." autocomplete="off" role="combobox" aria-autocomplete="list" aria-controls="student-search-results" aria-expanded="false">
              </label>
              <div id="student-search-results" class="student-search-results" role="listbox" aria-label="Book search results" hidden></div>
            </div>
            <span class="backend-badge student-system-status" role="status" aria-label="Northstar student portal"><i aria-hidden="true"></i><span>Student portal</span></span>
            <div class="student-notification-wrap">
              <button class="student-notification-button" id="student-notification-button" type="button" aria-label="Loan notifications" aria-expanded="false" aria-controls="student-notification-popover">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></svg>
                <span class="student-notification-dot" id="student-notification-dot" hidden></span>
              </button>
              <div class="student-notification-popover" id="student-notification-popover" role="status" aria-live="polite" hidden></div>
            </div>
            <span class="student-date" id="student-date"></span>
            <a class="who student-profile-trigger" id="student-profile-trigger" href="profile.html" aria-label="View my profile">
                <span class="av" id="uav"></span>
                <span class="student-profile-copy"><strong id="uname"></strong><small class="role-label">Student</small></span>
                <span class="student-chevron" aria-hidden="true">⌄</span>
            </a>
          </div>
        </header>
        <div id="view"><div class="panel">Loading your fines…</div></div>
      </main>
    </div>
    <div class="book-details-backdrop" id="book-details-backdrop" hidden onclick="closeBookDetails(event)">
      <section class="book-details-dialog" id="book-details-dialog" role="dialog" aria-modal="true" aria-labelledby="book-details-title" tabindex="-1">
        <button class="book-details-close" aria-label="Close book details" onclick="closeBookDetails(event)">×</button>
        <div id="book-details-content"></div>
      </section>
    </div>
    <script src="../js/book-covers.js"></script>
    <script src="../js/northstar.js"></script>
  </body>
</html>
