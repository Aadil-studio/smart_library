<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#0a0d2b">
  <title>Choose new password | Northstar Library</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link rel="stylesheet" href="css/style.css">
  <script defer src="js/common.js"></script><script defer src="js/auth.js"></script>
</head>
<body>
  <div class="app-background" aria-hidden="true"></div><div class="ambient-orb" aria-hidden="true"></div><div class="alert-region" aria-live="polite"></div>
  <main class="auth-page"><div class="auth-wrap">
    <div class="auth-brand"><a class="brand" href="index.html"><span class="brand-mark"><i class="fa-solid fa-book-open-reader"></i></span> Northstar Library</a></div>
    <section class="auth-card glass-panel" aria-labelledby="form-title">
      <span class="eyebrow"><i class="fa-solid fa-lock"></i> Step 3 of 3</span><h1 class="auth-heading" id="form-title">Choose a new password</h1>
      <p class="auth-subtitle">Use a strong password you have not used for this account before.</p>
      <form class="form-stack" id="resetForm" novalidate>
        <div class="field"><label for="reset-password">New password</label><div class="input-wrap"><i class="field-icon fa-solid fa-lock"></i><input class="password-input" id="reset-password" name="password" type="password" autocomplete="new-password" placeholder="At least 8 characters" required minlength="8"><button class="password-toggle" type="button" data-toggle-password data-target="reset-password" aria-label="Show password"><i class="fa-regular fa-eye"></i></button></div><div class="password-meter" data-password-meter><div class="meter-track"><span></span><span></span><span></span><span></span></div><span class="meter-label">Enter a password</span></div></div>
        <div class="field"><label for="reset-confirm">Confirm new password</label><div class="input-wrap"><i class="field-icon fa-solid fa-shield-halved"></i><input class="password-input" id="reset-confirm" name="confirmPassword" type="password" autocomplete="new-password" placeholder="Enter it again" required minlength="8"><button class="password-toggle" type="button" data-toggle-password data-target="reset-confirm" aria-label="Show password"><i class="fa-regular fa-eye"></i></button></div></div>
        <button class="primary-btn full" type="submit"><span>Reset password</span><i class="fa-solid fa-check"></i></button>
      </form>
      <p class="auth-footer"><a class="text-link" href="login.html"><i class="fa-solid fa-arrow-left"></i> Back to sign in</a></p>
      <p class="auth-note">The demo never stores or transmits your password.</p>
    </section>
  </div></main>
</body>
</html>
